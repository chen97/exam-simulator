<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Exam Simulator</title>
<meta name="color-scheme" content="light dark" />
<meta name="theme-color" content="#f5f7fa" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#12161c" media="(prefers-color-scheme: dark)" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
</head>
<body>
<script>
// design-system v1.2, tokens.md § type scaling: "Read it before first paint;
// a flash of default-size type on every load is worse than not shipping the
// control." Same argument applies to theme and density, so all three
// land here. React re-applies them on mount; this only removes the flash.
(function () {
  try {
    var t = JSON.parse(localStorage.getItem('examSim:tweaks') || '{}') || {};
    var el = document.documentElement;
    var theme = t.theme === 'light' || t.theme === 'dark' ? t.theme
      : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    el.setAttribute('data-theme', theme);
    el.setAttribute('data-density', t.density || 'comfortable');
    // Snap to one of the five steps — never write an in-between factor.
    var steps = [0.875, 1, 1.125, 1.25, 1.5];
    var n = Number(t.fontSize);
    var step = !isFinite(n) || n <= 0 ? 1 : steps.reduce(function (best, s) {
      return Math.abs(s - n) < Math.abs(best - n) ? s : best;
    });
    el.style.setProperty('--t-scale', String(step));
  } catch (e) { /* unreadable or blocked storage — defaults stand */ }
})();
</script>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
